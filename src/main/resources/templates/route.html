<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Routes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="wrapper">

    <!-- SIDEBAR (IMPORTANT FIX) -->
    <div class="sidebar">
        <h2>🚚 FMS</h2>

        <a href="/dashboard">Dashboard</a>
        <a href="/driver">Drivers</a>
        <a href="/vehicle">Vehicles</a>
        <a href="/task">Delivery Tasks</a>
        <a href="/route">Routes</a>
        <a href="/optimize">Route Optimization</a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">

        <h2>Route Management</h2>

        <!-- FORM -->
        <div class="card p-4 mt-4">

            <form action="/route/save" method="post">

                <div class="mb-3">
                    <label>Source</label>
                    <input type="text" class="form-control" name="source" required>
                </div>

                <div class="mb-3">
                    <label>Destination</label>
                    <input type="text" class="form-control" name="destination" required>
                </div>

                <div class="mb-3">
                    <label>Distance</label>
                    <input type="number" class="form-control" name="distance" required>
                </div>

                <button class="btn btn-success">Save Route</button>

            </form>

            <!-- SUCCESS MESSAGE -->
            <div th:if="${success}" class="alert alert-success mt-3">
                <span th:text="${success}"></span>
            </div>

        </div>

        <!-- TABLE -->
        <div class="card p-4 mt-4">

            <h4>All Routes</h4>

            <table class="table table-bordered mt-3">

                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Source</th>
                        <th>Destination</th>
                        <th>Distance</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="r : ${routes}">
                        <td th:text="${r.id}"></td>
                        <td th:text="${r.source}"></td>
                        <td th:text="${r.destination}"></td>
                        <td th:text="${r.distance}"></td>
                    </tr>
                </tbody>

            </table>

        </div>

    </div>
</div>

</body>
</html>
