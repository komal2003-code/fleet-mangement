<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<title>Vehicle Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->
    <div class="sidebar">

        <h2>🚚 FMS</h2>

        <a href="/dashboard">Dashboard</a>
        <a href="/driver">Drivers</a>
        <a href="/vehicle">Vehicles</a>
        <a href="/task">Delivery Tasks</a>
        <a href="/route">Routes</a>
        <a href="/optimize">Route Optimization</a>

    </div>

    <!-- Main Content -->
    <div class="main-content">

        <h2>Vehicle Registration</h2>

        <!-- Vehicle Form Card -->
        <div class="card form-card mt-4">

            <form action="/vehicle/save" method="post">

                <div class="mb-3">
                    <label>Vehicle Number</label>
                    <input type="text"
                           class="form-control"
                           name="vehicleNumber"
                           placeholder="Enter vehicle number"
                           required>
                </div>

                <div class="mb-3">
                    <label>License Plate</label>
                    <input type="text"
                           class="form-control"
                           name="licensePlate"
                           placeholder="Enter license plate"
                           required>
                </div>

                <div class="mb-3">
                    <label>Capacity</label>
                    <input type="number"
                           class="form-control"
                           name="capacity"
                           placeholder="Enter capacity"
                           required>
                </div>

                <div class="mb-3">
                    <label>Status</label>

                    <select class="form-control"
                            name="maintenanceStatus">

                        <option value="ACTIVE">ACTIVE</option>
                        <option value="INACTIVE">INACTIVE</option>

                    </select>
                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Register Vehicle
                </button>

            </form>

            <!-- Success Message -->
            <div th:if="${success}"
                 class="alert alert-success mt-3">

                <span th:text="${success}"></span>

            </div>

        </div>

        <!-- Vehicle Table -->
        <div class="card mt-4 p-4">

            <h4>Registered Vehicles</h4>

            <table class="table table-bordered table-hover mt-3">

                <thead class="table-dark">

                <tr>
                    <th>ID</th>
                    <th>Vehicle Number</th>
                    <th>License Plate</th>
                    <th>Capacity</th>
                    <th>Status</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="v : ${vehicles}">

                    <td th:text="${v.id}"></td>
                    <td th:text="${v.vehicleNumber}"></td>
                    <td th:text="${v.licensePlate}"></td>
                    <td th:text="${v.capacity}"></td>
                    <td th:text="${v.maintenanceStatus}"></td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
