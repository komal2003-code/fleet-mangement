<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Dispatch</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="wrapper">

<div class="sidebar">

<h2>🚚 FMS</h2>

<a href="/dashboard">Dashboard</a>
<a href="/driver">Drivers</a>
<a href="/vehicle">Vehicles</a>
<a href="/task">Delivery Tasks</a>
<a href="/route">Routes</a>
<a href="/optimize">Route Optimization</a>
<a href="/dispatch">Dispatch</a>

</div>

<div class="main-content">

<h2>Dispatch Delivery</h2>

<div class="card p-4 mt-4">

<form action="/dispatch/save"
      method="post">

<div class="mb-3">

<label>Task</label>

<select name="taskId"
        class="form-control">

<option value="">
Select Task
</option>

<option
th:each="t : ${tasks}"
th:value="${t.id}"
th:text="${t.customerName}">
</option>

</select>

</div>

<div class="mb-3">

<label>Driver</label>

<select name="driverId"
        class="form-control">

<option value="">
Select Driver
</option>

<option
th:each="d : ${drivers}"
th:value="${d.id}"
th:text="${d.name}">
</option>

</select>

</div>

<div class="mb-3">

<label>Vehicle</label>

<select name="vehicleId"
        class="form-control">

<option value="">
Select Vehicle
</option>

<option
th:each="v : ${vehicles}"
th:value="${v.id}"
th:text="${v.vehicleNumber}">
</option>

</select>

</div>

<div class="mb-3">

<label>Route</label>

<select name="routeId"
        class="form-control">

<option value="">
Select Route
</option>

<option
th:each="r : ${routes}"
th:value="${r.id}"
th:text="${r.startLocation}">
</option>

</select>

</div>

<button class="btn btn-success">
Dispatch
</button>

</form>

</div>

</div>
</div>

</body>
</html>
