<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Dispatch</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="wrapper">

<div class="sidebar">

<h2>🚚 FMS</h2>

<a href="/dashboard">Dashboard</a>
<a href="/driver">Drivers</a>
<a href="/vehicle">Vehicles</a>
<a href="/task">Delivery Tasks</a>
<a href="/route">Routes</a>
<a href="/optimize">Route Optimization</a>
<a href="/dispatch">Dispatch</a>

</div>

<div class="main-content">

<h2>Dispatch Delivery</h2>

<div class="card p-4 mt-4">

	<div th:if="${success}"
	     class="alert alert-success"
	     th:text="${success}">
	</div>

	<div th:if="${error}"
	     class="alert alert-danger"
	     th:text="${error}">
	</div>
	
	<form th:action="@{/dispatch/save}"
	      method="post">

<div class="mb-3">

<label>Task</label>

<select name="taskId"
        class="form-control">

<option value="">
Select Task
</option>

<option
th:each="t : ${tasks}"
th:value="${t.id}"
 th:text="${t.pickupLocation}">
</option>

</select>

</div>

<div class="mb-3">

<label>Driver</label>

<select name="driverId"
        class="form-control">

<option value="">
Select Driver
</option>

<option th:each="d : ${drivers}"
        th:value="${d.id}"
        th:text="${d.driverName}">
</option>
</select>

</div>

<div class="mb-3">

<label>Vehicle</label>

<select name="vehicleId"
        class="form-control">

<option value="">
Select Vehicle
</option>

<option
th:each="v : ${vehicles}"
th:value="${v.id}"
th:text="${v.vehicleNumber}">
</option>

</select>

</div>

<div class="mb-3">

<label>Route</label>

<select name="routeId"
        class="form-control">

<option value="">
Select Route
</option>

<option
th:each="r : ${routes}"
th:value="${r.id}"
th:text="${r.source + ' → ' + r.destination}">
</option>

</select>

</div>

<button class="btn btn-success">
Dispatch
</button>

</form>
<h3 class="mt-4">Dispatch Status</h3>

<div class="table-responsive">
<table class="table table-bordered table-striped">

<thead>
<tr>
<th>ID</th>
<th>Pickup</th>
<th>Drop</th>
<th>Driver</th>
<th>Vehicle</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody>

<tr th:each="t : ${tasks}">

<td th:text="${t.id}"></td>
<td th:text="${t.pickupLocation}"></td>
<td th:text="${t.dropLocation}"></td>

<td th:text="${t.driver != null ? t.driver.driverName : '-'}"></td>

<td th:text="${t.vehicle != null ? t.vehicle.vehicleNumber : '-'}"></td>

<td>

<span th:if="${t.status.name()=='UNASSIGNED'}"
      class="badge bg-secondary">
UNASSIGNED
</span>

<span th:if="${t.status.name()=='DISPATCHED'}"
      class="badge bg-warning">
DISPATCHED
</span>

<span th:if="${t.status.name()=='IN_TRANSIT'}"
      class="badge bg-info">
IN_TRANSIT
</span>

<span th:if="${t.status.name()=='DELIVERED'}"
      class="badge bg-success">
DELIVERED
</span>

</td>

<td>

<a th:if="${t.status.name() == 'UNASSIGNED'}"
   th:href="@{/dispatch/start/{id}(id=${t.id})}"
   class="btn btn-success btn-sm">
Dispatch
</a>

<a th:if="${t.status.name() == 'DISPATCHED'}"
   th:href="@{/dispatch/transit/{id}(id=${t.id})}"
   class="btn btn-warning btn-sm">
Transit
</a>

<a th:if="${t.status.name() == 'IN_TRANSIT'}"
   th:href="@{/dispatch/deliver/{id}(id=${t.id})}"
   class="btn btn-primary btn-sm">
Deliver
</a>

</td>

</tr>

</tbody>
</table>
</div>
</div>

</div>
</div>

</body>
</html>
