<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Route Optimization</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="wrapper">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>🚚 FMS</h2>

        <a href="/dashboard">Dashboard</a>
        <a href="/driver">Drivers</a>
        <a href="/vehicle">Vehicles</a>
        <a href="/task">Delivery Tasks</a>
        <a href="/route">Routes</a>
        <a href="/optimize">Route Optimization</a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">

        <h2>Route Optimization</h2>

        <!-- FORM -->
        <div class="card p-4 mt-4">

			<form action="/optimize" method="post">

                <div class="mb-3">
                    <label>Stops JSON (Paste here)</label>
                    <textarea class="form-control" name="json" rows="6"
                        placeholder='[
  {"name":"Pune","lat":18.52,"lon":73.85},
  {"name":"Mumbai","lat":19.07,"lon":72.87},
  {"name":"Nashik","lat":19.99,"lon":73.78}
]'></textarea>
                </div>

                <button class="btn btn-primary">
                    Optimize Route
                </button>

            </form>

        </div>

        <!-- RESULT -->
        <div class="card p-4 mt-4" th:if="${result != null}">

            <h4>Optimized Result</h4>

            <p><b>Total Distance:</b> <span th:text="${result.totalDistance}"></span></p>
            <p><b>Duration:</b> <span th:text="${result.duration}"></span></p>

            <h5>Route Order:</h5>
            <ul>
                <li th:each="r : ${result.optimizedRoute}" th:text="${r}"></li>
            </ul>

        </div>
		<!-- ERROR -->
		       <div class="alert alert-danger mt-3" th:if="${error}">
		           <span th:text="${error}"></span>
		       </div>

    </div>

</div>

</body>
</html>
